name: build-garb-index

on:
  schedule:
    - cron: '17 */4 * * *'     # 每 4 小时跑一次
  workflow_dispatch:
    inputs:
      rounds:
        description: 'walk-seeds 轮数'
        default: '30'
      budget:
        description: 'neighbors 时间预算（秒）'
        default: '1500'

permissions:
  contents: write

concurrency:
  group: garb-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉在售目录当种子
        continue-on-error: true
        run: |
          python tools/index_build.py walk-seeds \
            --rounds ${{ github.event.inputs.rounds || 30 }} --sleep 1.2

      - name: 从「我的装扮」采集
        continue-on-error: true
        run: |
          SEEDS=$(paste -sd, data/seed_vmids.txt)
          echo "种子: $SEEDS"
          python tools/index_build.py users --vmids "$SEEDS" --no-follow --expand 40 --sleep 1.2

      - name: 采集收藏集大厅
        continue-on-error: true
        run: |
          SEEDS=$(paste -sd, data/seed_vmids.txt)
          python tools/collections.py collect --vmids "$SEEDS" --sleep 1.2

      - name: 提取主题部件
        continue-on-error: true
        run: python tools/themes.py build --limit 40 --sleep 1.2

      - name: 导出 catalog.json
        run: python tools/index_build.py export

      - name: 统计
        run: python tools/index_build.py stats

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/garb_index.json data/mall_ids.json data/themes.json data/collections.json Surge/catalog.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "data: 索引更新 $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
          fi
