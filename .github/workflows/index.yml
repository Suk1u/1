name: build-garb-index

on:
  schedule:
    - cron: '17 */4 * * *'     # 每 4 小时跑一次
  workflow_dispatch:
    inputs:
      budget:
        description: '时间预算（秒）'
        default: '1500'

permissions:
  contents: write

concurrency:
  group: garb-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑流水线
        # ① 全站目录 → ② 找 owner → ③ 排大户 → ④ 采装扮 → ⑤ 判状态 → ⑥ 导出
        # 每步都查新鲜度，跑过的跳过；预算用完就停，下次接着跑
        continue-on-error: true
        run: python tools/pipeline.py --budget ${{ github.event.inputs.budget || 1500 }}

      - name: 收藏集 / 主题（独立，失败不影响主流程）
        continue-on-error: true
        run: |
          SEEDS=$(paste -sd, data/seed_vmids.txt 2>/dev/null || echo "2")
          python tools/collections.py collect --vmids "$SEEDS" --sleep 1.2 || true
          python tools/themes.py build --limit 40 --sleep 1.2 || true

      - name: 统计
        if: always()
        run: |
          python tools/fetch_all.py --stats || true
          python tools/index_build.py stats || true

      - name: 提交
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ Surge/catalog.json Surge/catalog-themes.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "data: 索引更新 $(date -u +%Y-%m-%dT%H:%M)Z"
            git push
          fi
