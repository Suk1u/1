<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>装扮库</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --line:#232936;
    --fg:#e8ecf4; --dim:#8b95a8; --pink:#fb7299; --cyan:#25b6c9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:rgba(13,15,20,.92);
         backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
         padding:12px 14px 0}
  h1{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:.5px}
  h1 em{font-style:normal;color:var(--pink)}
  .search{position:relative;margin:0 0 10px}
  .search input{width:100%;padding:9px 34px;border-radius:10px;border:1px solid var(--line);
                background:var(--panel);color:var(--fg);font-size:14px;outline:none;
                -webkit-appearance:none}
  .search input:focus{border-color:var(--pink)}
  .search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);
               color:var(--dim);font-size:13px;pointer-events:none}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
               width:22px;height:22px;border:0;border-radius:50%;background:#2a3140;
               color:var(--dim);font-size:13px;line-height:1;cursor:pointer;display:none}
  .search.has .clr{display:block}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--line);
       background:transparent;color:var(--dim);font-size:13px;cursor:pointer;transition:.15s}
  .tab.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
  .meta{padding:8px 14px;color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
        gap:10px;padding:0 12px 24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;cursor:pointer;transition:.15s;position:relative}
  .card:active{transform:scale(.97)}
  .card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#0a0c11}
  .card .noimg{width:100%;aspect-ratio:3/4;display:flex;align-items:center;
               justify-content:center;color:#39404f;font-size:12px}
  .card .info{padding:8px 10px 10px}
  .card .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis}
  .card .id{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:6px;
         font-size:11px;font-weight:600;backdrop-filter:blur(6px)}
  .b-del{background:rgba(251,114,153,.9);color:#fff}
  .b-on{background:rgba(37,182,201,.85);color:#04222a}
  .b-own{position:static;display:inline-block;margin-top:6px;
         background:rgba(255,255,255,.1);color:var(--fg);font-weight:400}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;
         z-index:50;padding:20px;overflow:auto}
  #modal.on{display:block}
  #modal .box{max-width:520px;margin:0 auto}
  #modal img{width:100%;border-radius:14px;display:block;background:#0a0c11}
  #modal .kv{margin-top:14px;background:var(--panel);border:1px solid var(--line);
             border-radius:12px;overflow:hidden}
  #modal .kv div{display:flex;padding:9px 14px;border-bottom:1px solid var(--line);
                 font-size:13px}
  #modal .kv div:last-child{border:0}
  #modal .kv b{width:96px;flex:0 0 96px;color:var(--dim);font-weight:400}
  #modal .kv span{word-break:break-all;font-variant-numeric:tabular-nums}
  #modal .close{margin:18px auto 0;display:block;padding:10px 28px;border-radius:999px;
                border:1px solid var(--line);background:var(--panel);color:var(--fg);
                font-size:14px;cursor:pointer}
  .empty{padding:60px 20px;text-align:center;color:var(--dim);line-height:1.9}
  .empty code{background:var(--panel);padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>装扮库 <em id="cnt"></em></h1>
  <div class="search" id="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜中文名，比如「夏日」" autocomplete="off">
    <button class="clr" id="clr" aria-label="清空">×</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">全部</button>
    <button class="tab" data-f="delisted">已下架</button>
    <button class="tab" data-f="onsale">在售</button>
    <button class="tab" data-f="own">已拥有</button>
    <button class="tab" data-f="unknown">未判定</button>
  </div>
</header>
<div class="meta" id="meta"></div>
<div class="grid" id="grid"></div>

<div id="modal"><div class="box">
  <img id="m-img" alt="">
  <div class="kv" id="m-kv"></div>
  <button class="close" onclick="closeM()">关闭</button>
</div></div>

<script>
let DATA = [], FILTER = 'all', QUERY = '';

const PUNCT = /[\s·・\-_\\|,，。.、:：;；!！?？()（）\[\]【】"'“”‘’]+/g;
function norm(s) { return String(s || '').toLowerCase().replace(PUNCT, ''); }

const qEl = document.getElementById('q');
const sEl = document.getElementById('search');
qEl.addEventListener('input', function () {
  QUERY = qEl.value.trim();
  sEl.classList.toggle('has', !!QUERY);
  render();
});
document.getElementById('clr').addEventListener('click', function () {
  qEl.value = ''; QUERY = ''; sEl.classList.remove('has'); render(); qEl.focus();
});

const SOURCES = ['catalog.json', 'Surge/catalog.json'];
function loadCatalog(i) {
  i = i || 0;
  if (i >= SOURCES.length) return Promise.reject(new Error('no catalog'));
  return fetch(SOURCES[i] + '?' + Date.now())
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(() => loadCatalog(i + 1));
}

loadCatalog()
  .then(d => d)
  .then(d => { DATA = d.items || []; document.getElementById('meta').textContent =
      '生成于 ' + (d.generated || '-') + ' · 共 ' + DATA.length + ' 条'; render(); })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<div class="empty">没有 catalog.json<br><br>' +
      '先跑 <code>python catalog.py seed --vmids 2,3</code><br>' +
      '再跑 <code>python catalog.py verify</code><br>' +
      '最后 <code>python catalog.py build</code></div>';
  });

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
  FILTER = b.dataset.f; render();
});

function pass(it) {
  if (QUERY) {
    var nq = norm(QUERY);
    var hay = norm(it.name) + '|' + norm(it.title) + '|' + String(it.garb_id);
    if (hay.indexOf(nq) < 0) return false;
  }
  if (FILTER === 'all') return true;
  if (FILTER === 'own') return !!it.isOwn;
  return (it.status || 'unknown') === FILTER;
}

function render() {
  const list = DATA.filter(pass);
  document.getElementById('cnt').textContent = list.length ? '(' + list.length + ')' : '';
  document.getElementById('grid').innerHTML = list.map((it, i) => {
    const st = it.status || 'unknown';
    const badge = st === 'delisted' ? '<span class="badge b-del">已下架</span>'
                : st === 'onsale'   ? '<span class="badge b-on">在售</span>' : '';
    const img = it.large
      ? '<img loading="lazy" src="' + esc(it.large) + '" alt="">'
      : '<div class="noimg">无图</div>';
    const own = it.isOwn ? '<span class="badge b-own">已拥有</span>' : '';
    return '<div class="card" data-i="' + DATA.indexOf(it) + '">' + badge + img +
           '<div class="info"><div class="nm">' + esc(it.name || it.title || '未命名') +
           '</div><div class="id">' + it.garb_id + ' / ' + it.image_id + '</div>' +
           own + '</div></div>';
  }).join('') || ('<div class="empty">' +
    (QUERY ? '没搜到「' + esc(QUERY) + '」<br><br>换个更短的关键词，或先跑<br><code>python tools/catalog.py harvest --seed 2 --max-users 500</code> 扩充索引'
           : '这个筛选下没有条目') + '</div>');
}

document.getElementById('grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  openM(DATA[+c.dataset.i]);
});

function openM(it) {
  document.getElementById('m-img').src = it.large || it.small || '';
  const rows = [
    ['garb_id', it.garb_id], ['image_id', it.image_id],
    ['名称', it.name || '-'], ['标题', it.title || '-'],
    ['状态', it.status], ['已拥有', it.isOwn ? '是' : '否'],
    ['来源', (it.sources || []).join(', ') || '-'],
    ['small', it.small || '-'], ['large', it.large || '-'],
  ];
  document.getElementById('m-kv').innerHTML =
    rows.map(([k, v]) => '<div><b>' + k + '</b><span>' + esc(String(v)) + '</span></div>').join('');
  document.getElementById('modal').classList.add('on');
}
function closeM() { document.getElementById('modal').classList.remove('on'); }
function esc(s) { return String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
</script>
</body>
</html>
